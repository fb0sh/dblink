services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dblink
      POSTGRES_PASSWORD: dblink
      POSTGRES_DB: dblink
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dblink -d dblink"]
      interval: 3s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dblink
      MYSQL_DATABASE: dblink
      MYSQL_USER: dblink
      MYSQL_PASSWORD: dblink
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdblink"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
